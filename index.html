	<!-- LIGHTBOX -->
	<link rel="stylesheet" href="lightbox/css/lightbox.css">
	<script src="lightbox/js/lightbox-plus-jquery.min.js"></script> 
	<script>
    lightbox.option({
      'resizeDuration': 50,
      'wrapAround': true,
	  'fadeDuration':100,
	  'showImageNumberLabel':false,
	  'positionFromTop': 10
	   })
	</script>
	<style>

		.lightboxOverlay{
			background-color: rgb(255, 249, 227);
		}

		.lightbox .lb-image{
			border: none;
			border-radius: 0;
		}

		.lb-nav a.lb-prev {
			background-image: url(soleil.svg);
			width: 10%;
		}

		.lb-nav a.lb-next{
			background-image: url(soleil.svg);
			width: 10%;
		} 
	 
	</style>
